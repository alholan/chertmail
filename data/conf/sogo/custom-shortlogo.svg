<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     x="0px" y="0px" width="50px" height="50px" viewBox="0 0 50 50">
  <defs>
    <linearGradient id="chertGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F47C4B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C6A87D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Mail Envelope Icon -->
  <g transform="translate(5, 10)">
    <!-- Envelope body -->
    <rect x="0" y="5" width="40" height="28" rx="3" ry="3" fill="url(#chertGradient)" />
    <!-- Envelope flap -->
    <path d="M0,8 L20,24 L40,8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Envelope bottom lines -->
    <path d="M4,30 L15,21" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M36,30 L25,21" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
