<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     x="0px" y="0px" width="300px" height="80px" viewBox="0 0 300 80">
  <defs>
    <linearGradient id="chertGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F47C4B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C6A87D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Mail Envelope Icon -->
  <g transform="translate(10, 15)">
    <!-- Envelope body -->
    <rect x="0" y="10" width="50" height="35" rx="3" ry="3" fill="url(#chertGradient)" />
    <!-- Envelope flap -->
    <path d="M0,13 L25,32 L50,13" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Envelope bottom lines -->
    <path d="M5,40 L20,28" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M45,40 L30,28" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- CHERT Mail Text -->
  <text x="75" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="600" fill="#F47C4B">
    CHERT
  </text>
  <text x="180" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="300" fill="#C6A87D">
    Mail
  </text>
</svg>
